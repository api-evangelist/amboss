name: AMBOSS
description: 'AMBOSS is a Berlin-based (AMBOSS SE) digital medical knowledge platform
  used by medical students, physicians, educators, and healthcare institutions worldwide.
  It combines a physician-authored medical library, exam-style Qbanks with AI-powered
  analytics, and a point-of-care clinical reference tool, plus AI features (LiSA)
  for evidence-based clinical decision support. AMBOSS sells consumer memberships
  and institutional licenses to medical schools, residency programs, and hospitals.
  It is a Partech portfolio company. This profile was enriched from AMBOSS'' public
  web and security surface; the medical platform publishes no public developer API
  (its amboss-mededu GitHub org hosts internal tooling), so this repo carries identity
  and security artifacts rather than API specifications.'
